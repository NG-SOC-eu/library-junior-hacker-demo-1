---
# Basic configuration of all defined devices
- name: Basic Initialization
  hosts: server, victim, attacker
  become: yes
  roles: 
    - hosts

- name: Configure Kali
  hosts: attacker
  become: yes
  roles:
    - attacker

- name: Configure Vulnerable Systems
  hosts: server, victim
  become: yes
  roles:
    - vulnerable-systems
