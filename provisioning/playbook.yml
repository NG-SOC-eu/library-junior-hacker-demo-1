---
- name: Setup Web Server (DMZ)
  hosts: web-ubuntu, internal-db
  become: yes
  roles:
    - web-ubuntu
    - internal_database

- name: Setup ATM Host and Docker
  hosts: atm-controller
  become: yes
  roles:
    - atm_controller

- name: Setup Internal DC
  hosts: internal-dc
  roles:
    - internal_dc

- name: Setup Internal Windows Server
  hosts: internal-windows
  roles:
    - internal_windows

- name: Setup Kali
  hosts: kali
  become: yes
  roles:
    - kali

- name: Configure Core Router
  hosts: core-router
  become: yes
  roles:
    - core-router

- name: setup hosts logging roles
  hosts:
    - routers
    - hosts
  become: yes
  vars:
    sandbox_name: junior-hacker-local
    central_syslog_ip: 78.128.251.179
  roles:
    - role: sandbox-logging
      slf_destination_port: '{% if hostvars["man"] is defined -%} 514 {%- else -%} 515 {%- endif %}'
      slf_destination: '{% if hostvars["man"] is defined -%} {{ hostvars["man"].ansible_host }} {%- else -%} {{ central_syslog_ip }} {%- endif %}'
      slf_sandbox_id: "{{ global_sandbox_id | default(student_id) | default(0) }}"
      slf_sandbox_name: '{{ global_sandbox_name | default(sandbox_name) }}'
      slf_pool_id: '{{ global_pool_id | default(None) }}'
