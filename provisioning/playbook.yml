---
- name: Setup Web Server (DMZ)
  hosts: web-ubuntu, internal_database
  become: yes
  roles:
    - dmz_web
    - internal_database

- hosts: internal_dc
  roles:
    - internal_dc

- name: Setup Internal Windows Server
  hosts: app-windows
  roles:
    - internal_windows

- name: Setup ATM Host and Docker
  hosts: atm-debian
  become: yes
  roles:
    - atm_controller

- name: Setup Kali
  hosts: kali
  become: yes
  roles:
    - kali

- name: Configure Core Router
  hosts: core-router
  become: yes
  roles:
    - core-router
