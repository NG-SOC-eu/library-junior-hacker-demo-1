---
- name: Install Active Directory Domain Services
  win_feature:
    name: AD-Domain-Services
    include_management_tools: yes
    state: present

- name: Ensure local Administrator has a strong password before DC promotion
  win_user:
    name: Administrator
    password: "UltimateVaultAdmin2026!"
    state: present

- name: Promote Server to Domain Controller (ironvault.local)
  win_domain:
    dns_domain_name: ironvault.local
    safe_mode_password: "VaultSafe2026!"
  register: ad_promotion

- name: Reboot after Promotion
  win_reboot:
    reboot_timeout: 1200
    post_reboot_delay: 240
  when: ad_promotion.reboot_required

- name: Create the 'windows' Domain User (The Player Account)
  win_domain_user:
    name: windows
    password: "IronVault2026!" # This matches the password they crack in the DB
    state: present
    groups:
      - Domain Users
  register: result
  until: result is not failed
  retries: 15
  delay: 30

- name: Create the Domain Admin (The Target)
  win_domain_user:
    name: iron_admin
    password: "UltimateVaultAdmin2026!"
    groups:
      - Domain Admins

- name: Ensure Administrator Desktop directory exists
  win_file:
    path: C:\Users\Administrator\Desktop
    state: directory

- name: Create Flag 13 (The DC Welcome Flag)
  win_copy:
    dest: C:\Users\Public\Desktop\flag13.txt
    content: "FLAG13{active_directory_overlord}"

- name: Ensure Scripts directory exists
  win_file:
    path: C:\Scripts
    state: directory

- name: Create Flag 14 (The API Script)
  win_copy:
    dest: C:\Scripts\atm_poll.ps1
    content: |
      # Legacy ATM Polling Script
      # API_KEY: FLAG14{3ncrypt3d_v4ult_4p1}
      $atm_ip = "10.10.30.30"
      Write-Host "Polling ATM at $atm_ip..."

- name: Create the NetOps troubleshooting note (hint for the core-router restriction)
  win_copy:
    dest: C:\Scripts\netops_notes.txt
    content: |
      NetOps - core-router troubleshooting access
      -------------------------------------------
      If external downloads (e.g. GitHub) are timing out, the DNS policy on
      core-router is likely the cause. Log in and check /etc/dnsmasq.d/.
      host: 10.10.20.1
      user: netops
      pass: R0uterAdm1n_2026!

- name: Open WinRM Firewall for internal-net only
  win_shell: |
    netsh advfirewall firewall set rule name="Windows Remote Management (HTTP-In)" new remoteip=10.10.20.0/24
    Set-NetFirewallRule -Name "WINRM-HTTP-In-TCP-PUBLIC" -RemoteAddress 10.10.20.0/24
    Set-NetFirewallRule -Name "WINRM-HTTP-In-TCP" -RemoteAddress 10.10.20.0/24

- name: Create a Backup directory for the "leak"
  win_file:
    path: C:\Windows\Temp\backups
    state: directory

- name: Leak the ATM binary to the App Server
  win_copy:
    src: /tmp/atm_vault_leaked
    dest: C:\Windows\Temp\backups\atm_vault
