---
- name: Install Active Directory Domain Services
  win_feature:
    name: AD-Domain-Services
    include_management_tools: yes
    state: present

- name: Ensure local Administrator has a strong password before DC promotion
  win_user:
    name: Administrator
    password: "UltimateVaultAdmin2026!"
    state: present

- name: Promote Server to Domain Controller (ironvault.local)
  win_domain:
    dns_domain_name: ironvault.local
    safe_mode_password: "VaultSafe2026!"
  register: ad_promotion

- name: Reboot after Promotion
  win_reboot:
    reboot_timeout: 1200
    post_reboot_delay: 240
  when: ad_promotion.reboot_required

- name: Create the 'windows' Domain User (The Player Account)
  win_domain_user:
    name: windows
    password: "IronVault2026!" # This matches the password they crack in the DB
    state: present
    groups:
      - Domain Users
  register: result
  until: result is not failed
  retries: 15
  delay: 30

- name: Create the Domain Admin (The Target)
  win_domain_user:
    name: iron_admin
    password: "UltimateVaultAdmin2026!"
    groups:
      - Domain Admins

- name: Ensure Administrator Desktop directory exists
  win_file:
    path: C:\Users\Administrator\Desktop
    state: directory

- name: Create Flag 13 (The DC Welcome Flag)
  win_copy:
    dest: C:\Users\Administrator\Desktop\flag13.txt
    content: "FLAG13{active_directory_overlord}"

- name: Ensure Scripts directory exists
  win_file:
    path: C:\Scripts
    state: directory

- name: Create Flag 14 (The API Script)
  win_copy:
    dest: C:\Scripts\atm_poll.ps1
    content: |

