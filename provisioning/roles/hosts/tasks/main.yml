---
# Basic configuration of all host devices
- name: Set the system hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Set up static hostname resolution
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ item.ip }} {{ item.name }}"
    state: present
  loop:
    - { ip: '10.0.16.50', name: 'attacker' }
    - { ip: '10.0.16.60', name: 'server' }
    - { ip: '10.0.16.100', name: 'victim' }

# 1. REMOVE THE POISON: Delete the broken Ubuntu-Docker repo file on the Attacker
- name: Remove broken Docker repository files
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  when: "'attacker' in inventory_hostname"

# 2. VACCINATE THE SYSTEM: Import the missing Kali GPG key for proxy-jump and attacker
#- name: Fix Kali GPG keys (Modern Method)
#  ansible.builtin.shell: |
#    curl -fsSL https://archive.kali.org/archive-key.asc | gpg --dearmor -o /etc/apt/trusted.gpg.d/kali-archive-keyring.gpg
#  register: gpg_fix
#  changed_when: gpg_fix.rc == 0
  # Applies to nodes identified with key errors in your output [cite: 13, 15]
#  when: inventory_hostname in ['attacker', 'proxy-jump']

- name: Force update apt cache
  ansible.builtin.apt:
    update_cache: yes
  register: apt_res
  retries: 3
  delay: 10
  until: apt_res is success
  # Ignore errors here to allow the playbook to reach the tool installation phase
  ignore_errors: yes

- name: Install basic networking and debug tools
  ansible.builtin.apt:
    name:
      - iputils-ping
      - net-tools
      - curl
      - vim
      - nano
      - unzip
    state: present
    update_cache: yes
