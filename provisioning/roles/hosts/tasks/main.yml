---
# Basic configuration of all host devices
- name: Set the system hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Set up static hostname resolution
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ item.ip }} {{ item.name }}"
    state: present
  loop:
    - { ip: '10.0.16.50', name: 'attacker' }
    - { ip: '10.0.16.60', name: 'server' }
    - { ip: '10.0.16.100', name: 'victim' }

# 1. REMOVE THE POISON: Delete the broken Ubuntu-Docker repo file on the Attacker
- name: Remove broken Docker repository files
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  when: "'attacker' in inventory_hostname"

# 2. VACCINATE THE SYSTEM: Import the missing Kali GPG key for proxy-jump and attacker
