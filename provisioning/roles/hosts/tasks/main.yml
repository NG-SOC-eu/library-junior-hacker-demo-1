#    wget -q -O - https://archive.kali.org/archive-key.asc | gpg --import
#    gpg --export ED65462EC8D5E4C5 | apt-key add -
#  register: gpg_fix
#  changed_when: gpg_fix.rc == 0
#  when: "'attacker' in inventory_hostname or 'proxy-jump' in inventory_hostname"

- name: Install basic networking and debug tools
  ansible.builtin.apt:
    name:
      - iputils-ping
      - net-tools
      - curl
      - vim
      - nano
      - unzip
    state: present
    update_cache: yes
