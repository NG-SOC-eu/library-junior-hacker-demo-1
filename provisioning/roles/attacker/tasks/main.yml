- name: Update OpenVAS Feeds (NVTs, SCAP, CERT)
  ansible.builtin.command: greenbone-feed-sync
  become: yes
  async: 1800 # We give it 30 minutes to succeed
  poll: 0     # we do not wait for it to complete to continue with the playbook
  register: gvm_feed_sync_output


