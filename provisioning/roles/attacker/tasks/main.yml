########################## Install Metasploit ##################
- name: Initialize Metasploit Database
  command: msfdb init --non-interactive
  become: yes
  register: msf_init
  # This makes sure the task is idempotent
  changed_when: "'already' not in msf_init.stdout"

- name: Set specific password for MSF user (for msfrpcd scripts)
  become: yes
  become_user: postgres
  postgresql_user:
    name: msf
    password: "msfpassword" # Set your required password here
    state: present

- name: Run Metasploit DB status check (forces migration if needed)
  command: msfconsole -q -x "db_status; exit"
  register: msf_migrate
  changed_when: "'connected to' in msf_migrate.stdout"

- name: Start msfrpcd for Metasploit RPC
#  command: msfrpcd -P "msfpassword" -n -a 127.0.0.1 -p 55553
  shell: "msfrpcd -P msfpassword -n -a 127.0.0.1 -p 55553 -S -f &"
  async: 10
  poll: 0

