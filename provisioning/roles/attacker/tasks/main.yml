- name: Deploy neo4j docker
  community.docker.docker_container:
    name: neo4j_instance
    image: neo4j:latest
    state: started
    restart_policy: always
    ports: 
      - "7474:7474"
      - "7687:7687"
    env:
      NEO4J_AUTH: neo4j/admin
      NEO4J_dbms_security_auth__minimum__password__length: "2"
    volumes:
      - "neo4j_data:/data"
  register: neo4j_output

- name: Wait for Neo4j to be ready (Bolt port)
  ansible.builtin.wait_for:
    host: "{{ ansible_host | default('localhost') }}"
    port: 7687
    delay: 5
    timeout: 120
    state: started
    msg: "Neo4j Bolt port is not listening after 2 minutes"

- name: Create second user named 'admin'
  ansible.builtin.shell: |
    docker exec -i neo4j_instance bin/cypher-shell -u neo4j -p admin "
      CREATE USER admin IF NOT EXISTS 
      SET PASSWORD 'admin' 
      CHANGE NOT REQUIRED;"
  changed_when: true
  register: create_user
  failed_when: "'already exists' not in create_user.stdout and create_user.rc != 0"

- name: Show Docker Compose output
  ansible.builtin.debug:
    msg: |
      Neo4j: {{neo4j_output | default('No output caprured') }}
