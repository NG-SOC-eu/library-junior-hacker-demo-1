- name: Ensure gvmd service is running
  ansible.builtin.service:
    name: gvmd
    state: started
    enabled: yes

- name: Metasploit Install Python packages for automation
  pip:
    name: 
      - pymetasploit3
      - python-gvm
    executable: /opt/caldera/venv/bin/pip3

- name: Ensure PostgreSQL service is running and enabled
  systemd:
    name: postgresql
    state: started
    enabled: yes
    
- name: Initialize Metasploit Database
  command: msfdb init
  args:
    creates: /usr/share/metasploit-framework/config/database.yml

- name: Ensure Python DB driver is installed (Debian/Ubuntu)
  apt:
    name: python3-psycopg2
    state: present
  become: yes
  when: ansible_facts['os_family'] == 'Debian'

- name: Ensure community.postgresql collection is available (run locally beforehand)
  ansible.builtin.debug:
    msg: "Make sure you ran: ansible-galaxy collection install community.postgresql"
  changed_when: false

- name: Ensure PostgreSQL user 'msf' exists with password
  become: yes
  become_user: postgres
  postgresql_user:
    name: msf
    password: "msfpassword"
    role_attr_flags: LOGIN
    expires: infinity
    state: present
    
- name: Create .msf4 directory
  file:
    path: "{{ ansible_env.HOME }}/.msf4"
    state: directory
    mode: '0755'

- name: Create Metasploit database.yml
  copy:
    dest: "{{ ansible_env.HOME }}/.msf4/database.yml"
    content: |
      development: &pgsql
        adapter: postgresql
        database: msf
        username: msf
        password: msfpassword
        host: localhost
        port: 5432
        pool: 5
        timeout: 5
      test:
        <<: *pgsql
        database: msf_test
        production:
        <<: *pgsql

- name: Start msfrpcd for Metasploit RPC
  command: msfrpcd -P "msfpassword" -n -a 127.0.0.1 -p 55553

- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - smbclient
      - cifs-utils
      - unzip
    state: present
    update_cache: yes

- name: Create /etc/apt/keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Install Docker and Dependencies from Kali Repos
  ansible.builtin.apt:
    name:
      - docker.io
      - python3-docker
      - docker-compose
    state: present
    update_cache: yes

- name: Ensure Docker service is started and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes

- name: Add user to docker group
  ansible.builtin.user:
    name: debian
    groups: docker
    append: yes

- name: Login to Docker Hub
  community.docker.docker_login:
    username: demongsoc
    password: "dckr_pat_OzOR3rfLKW3QcFAFUfAi_Je_5_Q"

- name: Deploy neo4j docker
  community.docker.docker_container:
    name: neo4j_instance
    image: neo4j:latest
    state: started
    restart_policy: always
    ports: 
      - "7474:7474"
      - "7687:7687"
    env:
      NEO4J_dbms_security_auth__minimum__password__length: 2
      NEO4J_AUTH: "neo4j/neo4j"
    volumes:
      - "neo4j_data:/data"
  register: neo4j_output

- name: Ensure admin user exists
  ansible.builtin.shell: |
    docker exec -i neo4j_instance bin/cypher-shell -u neo4j -p neo4j "
    CREATE USER admin IF NOT EXISTS SET PASSWORD 'admin' CHANGE NOT REQUIRED;
    GRANT ROLE admin TO admin;"

- name: Show Docker Compose output
