---
- name: Wait for SSH to be fully ready
  ansible.builtin.wait_for_connection:
    timeout: 300

- name: Set password on User debian
  ansible.builtin.user:
    name: debian
    password: "{{ 'qwerty!23' | password_hash('sha512') }}"
    update_password: always

- name: Update apt repo cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  become: yes

- name: Fix broken dpkg state (Pre-check)
  ansible.builtin.shell: |
    dpkg --configure -a
    apt-get install -f -y
  register: dpkg_fix
  changed_when: false

- name: Force resolve pyinstaller package conflict
  ansible.builtin.shell: |
    apt-get -o Dpkg::Options::="--force-overwrite" install -y pyinstaller-hooks-contrib
  environment:
    DEBIAN_FRONTEND: noninteractive
  changed_when: true

- name: Update all packages
  apt:
#    upgrade: dist
    upgrade: yes
    autoremove: yes
    update_cache: yes
    dpkg_options: 'force-confold,force-confdef'
  environment:
    DEBIAN_FRONTEND: noninteractive
  register: upgrade_output
  retries: 3
  delay: 10
  until: upgrade_output is success

- name: Install needed packages
  apt:
    name: 
      - zaproxy
      - nmap
      - "gvm*"
      - git
      - python3-full
      - python3-pip
      - python3-venv
      - build-essential
      - libssl-dev
      - libffi-dev
      - python3-dev
      - golang
      - nodejs
      - npm
      - nano
      - smbclient
      - cifs-utils
      - unzip
      - rsync
      - redis
      - postgresql
    state: present
    install_recommends: yes
  
- name: Create mount point
  file:
    path: "/mnt/smb_shared"
    state: directory
    mode: "0775"
          
- name: Mount SMB Share (guest)
  mount:
    src: "//10.250.232.198/shared"
    path: "/mnt/smb_shared"
    fstype: cifs
    opts: "guest,vers=3.0"
    state: mounted

- name: Copy Scripts
  copy:
    src: "/mnt/smb_shared/scripts.zip"
    dest: "/opt/scripts.zip"
    remote_src: true
    mode: "0644"

- name: Unarchive scripts
  ansible.builtin.unarchive:
    src: "/opt/scripts.zip"
    dest: "/opt/"
    remote_src: true
    extra_opts: ["-o"]

- name: Copy all scripts to "/usr/local/bin"
  copy:
    src: "/opt/Scripts/{{ item }}"
    dest: "/usr/local/bin/{{ item | regex_replace('\\.py$', '') }}"
    remote_src: true
    mode: "0755"
  loop:
    - nmap_auto.py
    - XML2JSON.py
    - Automation_Pipeline.py


####################### Installing MITRE CALDERA ##################################
- name: Git Clone Caldera
  git:
    repo: "https://github.com/mitre/caldera.git"
    dest: /opt/caldera
    recursive: yes
    force: yes

- name: Replace Caldera requirements.txt file
  copy:
    dest: /opt/caldera/requirements.txt
    content: |
      aiohttp-jinja2==1.5.1
      aiohttp==3.10.8
      aiohttp_session==2.12.0
      aiohttp-security==0.4.0
      aiohttp-apispec==3.0.0b2
      jinja2==3.1.6
      pyyaml==6.0.1
      cryptography==44.0.1
      websockets==15.0
      Sphinx==7.1.2
      sphinx_rtd_theme==1.3.0
      myst-parser==2.0.0
      marshmallow==3.20.1
      dirhash==0.2.1
      marshmallow-enum==1.5.1
      ldap3==2.9.1
      lxml~=5.3.1  # debrief
      reportlab==4.0.4  # debrief
      rich==13.7.0
      svglib==1.5.1  # debrief
      Markdown==3.4.4  # training
      dnspython==2.4.2
      asyncssh==2.14.1
      aioftp~=0.20.0
      packaging==23.2
      croniter~=3.0.3
    owner: root
    group: root
    mode: "0644"

- name: Create Python virtual environment
  command: python3 -m venv /opt/caldera/venv
  args:
    creates: /opt/caldera/venv

- name: Install python Requiremnts
  pip:
    requirements: /opt/caldera/requirements.txt
    virtualenv: /opt/caldera/venv
    virtualenv_python: python3
    
- name: Install Python dev requiremnts
  pip:
    requirements: /opt/caldera/requirements-dev.txt
    virtualenv: /opt/caldera/venv
    virtualenv_python: python3
    
- name: Create startup script
  copy:
    dest: /start-caldera.sh
    content: |
      #!/bin/bash
      echo "Activating Virtual Environment..."
      cd /opt/caldera/
      source /opt/caldera/venv/bin/activate
      echo "Starting CALDERA"
      python3 /opt/caldera/server.py --insecure --build
    mode: "0755"
    owner: root
    group: root

- name: Create caldera service 
  copy:
    dest: /etc/systemd/system/caldera.service
    content: |
      [Unit]
      Description=Caldera Service
      After=network.target

      [Service]
      ExecStart=/start-caldera.sh
      Restart=always
      User=root

      [Install]
      WantedBy=multi-user.target
    mode: "0644"

- name: Reload systemd
  command: systemctl daemon-reload

- name: Enable Caldera service
  service:
    name: caldera
    enabled: yes
    state: started


########## Fixing the Postgres mismatch #############################
- name: Force Migrate PostgreSQL to Version 18 for GVM
  become: yes
  shell: |
    # 1. Stop all postgres services
    systemctl stop postgresql
    
    # 2. If a fresh/empty PG 18 "main" exists, drop it so we can upgrade 17 into that slot
    if pg_lsclusters | grep -q "18 main"; then
      pg_dropcluster 18 main --stop
    fi
    
    # 3. If PG 17 "main" exists, upgrade it to 18
    if pg_lsclusters | grep -q "17 main"; then
      pg_upgradecluster 17 main
      # 4. Drop the old version to free up the system and prevent port confusion
      pg_dropcluster 17 main --stop
    fi
    
    # 5. Ensure PG 18 is set to port 5432 if it isn't already
    sed -i 's/port = .*/port = 5432/' /etc/postgresql/18/main/postgresql.conf
    
    # 6. Start the service
    systemctl start postgresql
  register: pg_migration_result
  changed_when: "'Configuring already up to date' not in pg_migration_result.stdout"

- name: Ensure PostgreSQL service is running and enabled
  service:
    name: postgresql
    state: started
    enabled: yes

