---
# ==========================================================
# Tasks for the Victim (The Foothold)
# ==========================================================
- name: Setup Foothold Services on Victim
  ansible.builtin.apt:
    name:
      - openssh-server
      - vsftpd
    state: present
    update_cache: yes
  when: inventory_hostname == 'victim'

- name: Create weak user account on Victim
  ansible.builtin.user:
    name: backup
    # Password is 'backup123'
    password: "{{ 'backup123' | password_hash('sha512') }}"
    shell: /bin/bash
  when: inventory_hostname == 'victim'

# ==========================================================
# Tasks for the Server (The High-Value Target)
# ==========================================================
- name: Setup Vulnerable Infrastructure on Server
  block:
    - name: Install Docker for vulnerable containers
      ansible.builtin.apt:
        name: docker.io
        state: present

    - name: Run Juice Shop (Target for ZAP and Metasploit)
      community.docker.docker_container:
        name: juice_shop
        image: bkimminich/juice-shop
        state: started
        restart_policy: always
        ports:
          # Matches your script's port check for ZAP
          - "8888:3000" 
  when: inventory_hostname == 'server'

  # ==========================================================
# Tasks for the Server (The High-Value Target)
# ==========================================================
- name: Setup Vulnerable Infrastructure on Server
  block:
    - name: Install Docker for vulnerable containers
      ansible.builtin.apt:
        name: docker.io
        state: present

    - name: Run Juice Shop (Target for ZAP and Metasploit)
      community.docker.docker_container:
        name: juice_shop
        image: bkimminich/juice-shop
        state: started
        restart_policy: always
        ports:
          # Matches your script's port check for ZAP
          - "8888:3000" 
  when: inventory_hostname == 'server'
