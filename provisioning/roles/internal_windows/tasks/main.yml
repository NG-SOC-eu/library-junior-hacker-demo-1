---
- name: Plant Flag 3 (Initial Windows Access)
  win_copy:
    dest: 'C:\Users\windows\Desktop\flag3.txt'
    content: "BSides{W1nRM_P1v0t_Succ3ss}"

- name: Create a vulnerable service directory structure
  win_file:
    path: 'C:\Program Files\Iron Vault'
    state: directory

# Ansible looks in provisioning/roles/internal_windows/files/
- name: Copy dummy update.exe from role files
  win_copy:
    src: dummy_update.exe
    dest: 'C:\Program Files\Iron Vault\update.exe'

- name: Create a vulnerable service for PrivEsc (Flag 4)
  win_command: 'sc create "IronVaultUpdate" binPath= "C:\Program Files\Iron Vault\update.exe" start= auto obj= LocalSystem'

- name: Plant Flag 4 (SYSTEM Privilege Escalation)
  win_copy:
    dest: 'C:\Windows\System32\flag4_system.txt'
    content: "BSides{SYSTEM_0wn3d_0n_W1nd0ws}"

- name: Plant Flag 5 (Network Recon for the ATM)
  win_copy:
    dest: 'C:\Users\windows\Documents\Network_Architecture.pdf'
    content: "CONFIDENTIAL: ATM Network Segment isolated at 10.10.30.0/24. Direct access from App Server only. BSides{Found_Th3_ATM_Subn3t}"
    
- name: Ensure the 'windows' player account is configured correctly
  win_user:
    name: windows
    password: IronVault2026!
    state: present
    groups:
      - Remote Management Users
      - Administrators

- name: Enable WinRM Basic Authentication for Evil-WinRM
  win_shell: winrm set winrm/config/service/auth '@{Basic="true"}'

- name: Enable WinRM Unencrypted traffic for Evil-WinRM
  win_shell: winrm set winrm/config/service '@{AllowUnencrypted="true"}'

- name: Allow WinRM TrustedHosts from any IP
  win_shell: Set-Item WSMan:\localhost\Client\TrustedHosts -Value '*' -Force

- name: Allow WinRM through the Windows Firewall from any subnet
  win_shell: Set-NetFirewallRule -DisplayGroup "Windows Remote Management" -Action Allow -Profile Any -RemoteAddress Any

- name: Disable remote UAC restrictions so Evil-WinRM can connect
  win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: LocalAccountTokenFilterPolicy
    data: 1
    type: dword


