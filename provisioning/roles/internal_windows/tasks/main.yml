---
- name: Set DNS to point to the Domain Controller
  win_dns_client:
    adapter_names: "*"
    dns_servers:
      - 10.10.20.50

- name: Join the App Server to the Domain
  win_domain_membership:
    dns_domain_name: ironvault.local
    domain_admin_user: iron_admin@ironvault.local
    domain_admin_password: "UltimateVaultAdmin2026!"
    state: domain
  register: domain_join

- name: Reboot and Wait for Connection
  win_reboot:
    reboot_timeout: 600
    post_reboot_delay: 60 
  when: domain_join.reboot_required

- name: Grant Domain User Local Admin Rights
  win_group_membership:
    name: Administrators
    members:
      - IRONVAULT\windows
    state: present

- name: Disable Defender (Important for the Exploit)
  win_shell: |
    Set-MpPreference -DisableRealtimeMonitoring $true
    Set-MpPreference -DisableIOAVProtection $true
  ignore_errors: yes

- name: Create the target directory for the vulnerable service
  win_file:
    path: 'C:\Program Files\Iron Vault'
    state: directory

- name: Copy dummy update.exe for the Unquoted Service Path
  win_copy:
    src: dummy_update.exe
    dest: 'C:\Program Files\Iron Vault\update.exe'

- name: Setup the Unquoted Service Path (Flag 11 Target)
  win_service:
    name: IronVaultUpdate
    path: C:\Program Files\Iron Vault\update.exe
    display_name: IronVaultUpdate
    start_mode: auto

- name: Ensure Domain Admin session is cached in memory (For Flag 12)
  win_shell: whoami
  become: yes
  become_method: runas
  become_user: IRONVAULT\iron_admin
  vars:
    ansible_become_password: "UltimateVaultAdmin2026!"
  ignore_errors: yes

- name: Create a persistent Scheduled Task to cache credentials
  win_scheduled_task:
    name: "AdminMaintenance"
    username: "IRONVAULT\\iron_admin"
    password: "UltimateVaultAdmin2026!"
    logon_type: password
    actions:
      - path: cmd.exe
        arguments: "/c timeout /t 3600" # Keep the process alive for an hour
    triggers:
      - type: boot
    state: present
    enabled: yes

# --- FLAG PLACEMENT ---
- name: Plant Flag 8 (Initial Windows Access)
  win_copy:
    dest: 'C:\Users\Public\Desktop\flag8.txt'
    content: "FLAG8{W1nRM_P1v0t_Succ3ss}"

- name: Plant Flag 9 (The ZIP file locked with Flag 3)
  win_copy:
    dest: 'C:\Users\Public\Documents\Internal_Network.zip'
    src: Internal_Network.zip 

- name: Plant Flag 11 (SYSTEM Privilege Escalation)
  win_copy:
    dest: 'C:\Windows\System32\flag11_system.txt'
    content: "FLAG11{SYSTEM_0wn3d_0n_W1nd0ws}"

# --- WINRM CONFIGURATION ---

- name: Finalize WinRM for Evil-WinRM access
  win_shell: |
    winrm set winrm/config/service/auth '@{Basic="true"}'
    winrm set winrm/config/service '@{AllowUnencrypted="true"}'
    Set-Item WSMan:\localhost\Client\TrustedHosts -Value '*' -Force
    Set-NetFirewallRule -DisplayGroup "Windows Remote Management" -Action Allow -Profile Any

- name: Disable remote UAC restrictions
  win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: LocalAccountTokenFilterPolicy
    data: 1
    type: dword
