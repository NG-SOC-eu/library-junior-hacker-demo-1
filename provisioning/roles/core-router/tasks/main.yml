---
- name: Enable IPv4 forwarding in the kernel
  sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: yes
    state: present
    reload: yes

- name: Capture the platform-provided DNS resolver before changing anything
  ansible.builtin.slurp:
    src: /etc/resolv.conf
  register: platform_resolv_conf

- name: Extract the platform's nameserver IP(s)
  ansible.builtin.set_fact:
    platform_nameservers: "{{ (platform_resolv_conf.content | b64decode).splitlines()
                               | select('match', '^\\s*nameserver\\s+')
                               | map('regex_replace', '^\\s*nameserver\\s+(\\S+).*$', '\\1')
                               | list }}"

- name: Fail fast if the platform's resolver could not be determined
  ansible.builtin.assert:
    that: platform_nameservers | length > 0
    fail_msg: "Could not find a nameserver in /etc/resolv.conf before making changes"

- name: Pre-seed iptables-persistent to skip its interactive save prompt
  ansible.builtin.debconf:
    name: iptables-persistent
    question: "iptables-persistent/autosave_{{ item }}"
    value: 'false'
    vtype: boolean
  loop:
    - v4
    - v6

- name: Update apt cache
  apt:
    update_cache: yes
  register: apt_update_result
  until: apt_update_result is succeeded
  retries: 5
  delay: 10

- name: Install dnsmasq and iptables-persistent
  apt:
    name:
      - dnsmasq
      - iptables-persistent
    state: present

- name: Free port 53 from systemd-resolved's stub listener
  ansible.builtin.lineinfile:
    path: /etc/systemd/resolved.conf
    regexp: '^#?DNSStubListener='
    line: 'DNSStubListener=no'
  register: resolved_conf

- name: Restart systemd-resolved after freeing port 53
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
  when: resolved_conf.changed

- name: Point the router's own resolver back at the platform's real resolver
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      {% for ns in platform_nameservers %}
      nameserver {{ ns }}
      {% endfor %}

- name: Deploy the GitHub DNS sinkhole config for dnsmasq
  ansible.builtin.copy:
    dest: /etc/dnsmasq.d/github-sinkhole.conf
    content: |
      no-resolv
      {% for ns in platform_nameservers %}
      server={{ ns }}
      {% endfor %}
      address=/github.com/0.0.0.0
      address=/githubusercontent.com/0.0.0.0
      address=/github.io/0.0.0.0
      address=/githubassets.com/0.0.0.0
  register: dnsmasq_conf

- name: Ensure dnsmasq is started and enabled
  ansible.builtin.systemd:
    name: dnsmasq
    state: started
    enabled: yes

- name: Restart dnsmasq after a sinkhole config change
  ansible.builtin.systemd:
    name: dnsmasq
    state: restarted
  when: dnsmasq_conf.changed

- name: Force all forwarded DNS traffic through the local sinkhole (UDP)
  ansible.builtin.iptables:
    table: nat
    chain: PREROUTING
    protocol: udp
    destination_port: '53'
    jump: REDIRECT
    to_ports: '53'
    comment: "Force forwarded DNS through the local GitHub sinkhole"

- name: Force all forwarded DNS traffic through the local sinkhole (TCP)
  ansible.builtin.iptables:
    table: nat
    chain: PREROUTING
    protocol: tcp
    destination_port: '53'
    jump: REDIRECT
    to_ports: '53'
    comment: "Force forwarded DNS through the local GitHub sinkhole"

- name: Persist iptables NAT rules across reboots
  ansible.builtin.shell: netfilter-persistent save
  changed_when: false

- name: Create the netops maintenance account
  ansible.builtin.user:
    name: netops
    password: "{{ 'R0uterAdm1n_2026!' | password_hash('sha512') }}"
    groups: sudo
    append: yes
    shell: /bin/bash
    create_home: yes
