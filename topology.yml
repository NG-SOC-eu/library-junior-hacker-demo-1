name: bsides-midnight-cash-scenario
hosts:
  - name: web-ubuntu
    base_box:
      image: ubuntu-noble-x86_64
      mgmt_user: ubuntu
    flavor: standard.small

  - name: app-windows
    base_box:
      image: windows-server-2019
      mgmt_user: windows
      mgmt_protocol: winrm
    flavor: standard.medium

  - name: atm-debian
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.small

routers:
  - name: core-router
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.small
    
networks:
  - name: dmz-net
    cidr: 10.10.10.0/24
    accessible_by_user: true # Players start here
  - name: internal-net
    cidr: 10.10.20.0/24
  - name: atm-net
    cidr: 10.10.30.0/24

net_mappings:
  - name: web-ubuntu
    network: dmz-net
    ip: 10.10.10.10
  - name: web-ubuntu
    network: internal-net
    ip: 10.10.20.10
  - name: app-windows
    network: internal-net
    ip: 10.10.20.20
  - name: app-windows
    network: atm-net
    ip: 10.10.30.20
  - name: atm-debian
    network: atm-net
    ip: 10.10.30.30
router_mappings:
  - router: core-router
    network: dmz-net
    ip: 10.10.10.254
  - router: core-router
    network: internal-net
    ip: 10.10.20.254
  - router: core-router
    network: atm-net
    ip: 10.10.30.254

groups: []
