name: bsides-midnight-cash-scenario
hosts:
  - name: kali
    base_box:
      image: kali
      mgmt_user: debian
    flavor: standard.medium

  - name: web-ubuntu
    base_box:
      image: ubuntu-noble-x86_64
      mgmt_user: ubuntu
    flavor: standard.small

  - name: app-windows
    base_box:
      image: windows-server-2019
      mgmt_user: windows
      mgmt_protocol: winrm
    flavor: standard.xmedium

  - name: atm-debian
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.small

routers:
  - name: core-router
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.small
    
networks:
  - name: attacker-net
    cidr: 10.10.0.0/24
    accessible_by_user: true
  - name: dmz-net
    cidr: 10.10.10.0/24
    accessible_by_user: false # DMZ απέναντι απο τον επιτιθέμενο
  - name: internal-net
    cidr: 10.10.20.0/24
  - name: atm-net
    cidr: 10.10.30.0/24

net_mappings:
  - host: kali
    network: attacker-net
    ip: 10.10.0.10
  - host: web-ubuntu
    network: dmz-net
    ip: 10.10.10.10
  - host: app-windows
    network: internal-net
    ip: 10.10.20.20
  - host: app-windows
    network: atm-net
    ip: 10.10.30.20
  - host: atm-debian
    network: atm-net
    ip: 10.10.30.30
router_mappings:
  - router: core-router
    network: attacker-net
    ip: 10.10.0.1
  - router: core-router
    network: dmz-net
    ip: 10.10.10.1
  - router: core-router
    network: internal-net
    ip: 10.10.20.1
  - router: core-router
    network: atm-net
    ip: 10.10.30.1

groups: []
