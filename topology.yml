name: penetration-testing-course
hosts:
  - name: attacker
    base_box:
      image: kali-custom
      mgmt_user: debian
    flavor: standard.xmedium
  - name: server
    base_box:
      image: ubuntu-noble-x86_64
      mgmt_user: ubuntu
    flavor: standard.xsmedium
  - name: victim
    base_box:
      image: ubuntu-noble-x86_64
      mgmt_user: ubuntu
    flavor: standard.small

routers:
  - name: router
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.small

networks:
  - name: pentest
    cidr: 10.1.26.0/24
    accessible_by_user: true

net_mappings:
  - host: attacker
    network: pentest
    ip: 10.0.16.50
  - host: server
    network: pentest
    ip: 10.0.16.60
  - host: victim
    network: pentest
    ip: 10.0.16.100

router_mappings:
  - router: router
    network: pentest
    ip: 10.0.16.1

groups: []
