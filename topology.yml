name: bsides-midnight-cash-scenario
hosts:
  - name: web-ubuntu
    base_box:
      image: ubuntu-noble-x86_64
      flavor: standard.small
    interfaces:
      - network: dmz-net
        ip: 10.10.10.10
      - network: internal-net
        ip: 10.10.20.10

  - name: app-windows
    base_box:
      image: windows-server-2019
      flavor: standard.medium
      mgmt_user: windows
      mgmt_protocol: winrm
    interfaces:
      - network: internal-net
        ip: 10.10.20.20
      - network: atm-net
        ip: 10.10.30.20

  - name: atm-debian
    base_box:
      image: debian-12-x86_64
      flavor: standard.small
    interfaces:
      - network: atm-net
        ip: 10.10.30.30

networks:
  - name: dmz-net
    cidr: 10.10.10.0/24
    accessible_by_user: true # Players start here
  - name: internal-net
    cidr: 10.10.20.0/24
  - name: atm-net
    cidr: 10.10.30.0/24

routers:
  - name: core-router
    cidr: 10.10.10.1/24
    base_box:
      image: debian-12-x86_64
      flavor: standard.small
    interfaces:
      - network: dmz-net
        ip: 10.10.10.254
      - network: internal-net
        ip: 10.10.20.254
      - network: atm-net
        ip: 10.10.30.254

groups: []
